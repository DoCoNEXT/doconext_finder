name: CI

# A change that touches nothing this workflow builds or checks does not run it.
# Its own files stay in: a change to ci.yml or .github/scripts/ is exactly the
# one that needs a run. One trade-off: REUSE checks Markdown too, so a new .md
# that REUSE.toml does not cover shows up on the next run instead of this one.
on:
  push:
    branches: [main]
    paths-ignore: &unbuilt
      - '**.md'
      - '.github/workflows/external-pull-requests.yml'
      - '.github/dependabot.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths-ignore: *unbuilt

# Nothing in this workflow writes to the repository, so the token gets read
# access and nothing else, whatever the repository's default setting says.
permissions:
  contents: read

# A push that supersedes a running build cancels it; the result of the old
# one would be discarded anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - run: composer lint

  php-cs:
    name: PHP code style
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
      - uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
      - run: composer cs:check

  # The one list of Nextcloud versions this app supports lives in
  # appinfo/info.xml. Reading it here rather than repeating it in a matrix
  # means the two cannot drift: widen max-version and the extra server is
  # analysed on the next run, with nobody having to remember.
  supported-versions:
    name: Supported Nextcloud versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ocp-versions: ${{ steps.read.outputs.versions }}
      next-version: ${{ steps.read.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, xml.etree.ElementTree as ET
          nc = ET.parse('appinfo/info.xml').getroot().find('./dependencies/nextcloud')
          if nc is None:
              raise SystemExit('appinfo/info.xml has no <dependencies><nextcloud> element')
          lo, hi = nc.get('min-version'), nc.get('max-version')
          if not lo or not hi:
              raise SystemExit('<nextcloud> needs both min-version and max-version')
          lo, hi = int(lo), int(hi)
          if hi < lo:
              raise SystemExit(f'max-version {hi} is below min-version {lo}')
          print('versions=' + json.dumps([f'dev-stable{v}' for v in range(lo, hi + 1)]))
          # The major after the one we claim, for the informational leg.
          print(f'next=dev-stable{hi + 1}')
          PY

  # An API only exists, or is only deprecated, in the version being analysed:
  # a class added in 32 is missing on 31, a method retired in 34 is invisible
  # against 33. Analysing one version tells you nothing about the rest of the
  # range this app claims to run on, so run the job once per version.
  psalm:
    name: Psalm static analysis (${{ matrix.ocp-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: supported-versions
    strategy:
      fail-fast: false
      matrix:
        ocp-version: ${{ fromJSON(needs.supported-versions.outputs.ocp-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
      - uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
      # composer.json pins one version so the lock file stays reproducible;
      # this swaps in whichever version the matrix leg is analysing.
      - run: composer require --dev --no-scripts --ignore-platform-reqs --with-dependencies nextcloud/ocp:${{ matrix.ocp-version }}
      - run: composer psalm

  # info.xml claims the versions the matrix above analyses. Nextcloud 35 is
  # already cut on nextcloud-deps/ocp, so this leg reads the app against an API
  # we do not claim yet: a class that moved or a signature that tightened shows
  # up here instead of on the day we bump max-version.
  #
  # Informational on purpose. stable35 is still moving, and a red leg here must
  # not block work that has nothing to do with it. It turns into a gate when we
  # add 35 to info.xml — at which point the matrix above covers it and this job
  # moves on to whatever major comes next.
  psalm-next:
    name: Psalm — next Nextcloud (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: supported-versions
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
      - uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
      # The branch may not exist yet — ocp only cuts it when the release is
      # branched — so fall back to master, which is always the next major.
      - name: Install the API of the major after the one info.xml claims
        run: |
          composer require --dev --no-scripts --ignore-platform-reqs --with-dependencies \
            'nextcloud/ocp:${{ needs.supported-versions.outputs.next-version }}' \
          || composer require --dev --no-scripts --ignore-platform-reqs --with-dependencies \
            'nextcloud/ocp:dev-master'
      - name: Ignore baseline entries that 35 already resolves
        run: sed -i 's/findUnusedBaselineEntry="true"/findUnusedBaselineEntry="false"/' psalm.xml
      - run: composer psalm

  phpunit:
    name: PHPUnit (standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
      - run: composer test:unit

  # The phpunit job above covers PHP versions against the locked stubs. This
  # one covers Nextcloud versions: once per version info.xml claims, taken from
  # the same supported-versions output psalm uses, so a max-version bump widens
  # it on its own.
  #
  # PHP 8.3, not 8.2. Nextcloud 35's API stubs use typed class constants
  # (`public const string …`), which is 8.3 syntax: on 8.2 the suite dies on a
  # ParseError before a single test runs. 8.3 is the one version every claimed
  # release accepts — 33 and 34 take 8.2 to 8.5, 35 takes 8.3 to 8.5. Psalm
  # gets away with 8.2 only because it parses with its own parser and never
  # loads the stubs.
  phpunit-nextcloud:
    name: PHPUnit (${{ matrix.ocp-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: supported-versions
    strategy:
      fail-fast: false
      matrix:
        ocp-version: ${{ fromJSON(needs.supported-versions.outputs.ocp-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
      - run: composer require --dev --no-scripts --no-progress --ignore-platform-reqs -W nextcloud/ocp:${{ matrix.ocp-version }}
      - run: composer test:unit
      # The stubs carry OCP only. The core-private search classes this app
      # constructs (lib/Search/CoreSearch.php) come from the server branch of
      # the same version — just that directory, not a Nextcloud install.
      - id: server-ref
        env:
          OCP_VERSION: ${{ matrix.ocp-version }}
        run: echo "ref=${OCP_VERSION#dev-}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/server
          ref: ${{ steps.server-ref.outputs.ref }}
          path: nextcloud-server
          sparse-checkout: lib/private/Files/Search
          submodules: false
          persist-credentials: false
      - run: composer test:platform
        env:
          NEXTCLOUD_SERVER_DIR: ${{ github.workspace }}/nextcloud-server

  # info.xml claims Nextcloud 31 to 34. The lockfile pins the 33 API stubs;
  # this run swaps in the 34 stubs so a class or signature that moved between
  # the two fails here, not on a customer's upgrade.

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run stylelint
      - run: npm run test
      - run: npm run build

  # Licensing metadata gate. Every tracked file must be covered by REUSE.toml
  # (or an SPDX header), and every licence it names must have its text in
  # LICENSES/. Fails on a new file nobody accounted for — which is the point.
  # It also fails on a licence text in LICENSES/ that no tracked file uses, so
  # do not add one "for the bundled dependencies": js/ and css/ are generated
  # and never in git, and each built bundle ships its own .license sidecar.
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # Dependency vulnerability gate. Blocks on advisories in *shipped* deps
  # (composer runtime + npm production) at moderate severity and above; CVEs in
  # dev-only tooling (vitest, phpunit, etc.) are reported but non-blocking, since
  # they never reach a customer's deployment. Dependabot still PRs fixes for both.
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --- PHP (composer) ---
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
      # `require` here is currently just `php`, so composer.lock carries no
      # production packages at all, and composer treats "nothing to audit" as
      # an error rather than a pass — the message names --locked as the remedy
      # but returns 1 with it too, because the empty set is the real problem.
      # So the empty case is skipped explicitly. The audit itself runs, and
      # blocks, from the moment a runtime dependency is added; --locked keeps
      # it reading the lock file, so it needs no install to do that.
      - name: Composer audit (production, blocking)
        run: |
          if [ "$(php -r 'echo count(json_decode(file_get_contents("composer.lock"), true)["packages"]);')" = "0" ]; then
            echo "No production composer packages in composer.lock - nothing to audit."
            exit 0
          fi
          composer audit --locked --no-dev
      - name: Composer audit (incl. dev, informational)
        run: composer audit --locked || true

      # --- JavaScript (npm) ---
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # Blocking gate on advisories in *shipped* (production) deps. The
      # production graph is currently clean, so AUDIT_ALLOWLIST is empty. Add a
      # GHSA id here only for a reviewed advisory in a package that cannot reach
      # a deployment (a bundler, say), with the reason written next to it.
      - name: npm audit (production, blocking)
        env:
          AUDIT_ALLOWLIST: ''
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node .github/scripts/audit-gate.mjs npm-audit.json
      - name: npm audit (incl. dev, informational)
        run: npm audit --audit-level=moderate || true

  # Build the release tarball exactly as `make appstore` does, and refuse one
  # that is the wrong shape (.github/scripts/check-tarball.sh, which the
  # release workflow runs too).
  package:
    name: Release tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: make appstore
      - name: Check what shipped
        run: .github/scripts/check-tarball.sh build/artifacts/doconext_finder.tar.gz

  # SBOM + third-party license inventory for enterprise buyers / audits and to
  # satisfy attribution duties of the MIT/Apache/BSD deps we redistribute.
  # Produces a CycloneDX SBOM (npm) plus composer + npm license listings,
  # uploaded as an artifact (regenerated on every run so it never drifts).
  sbom:
    name: SBOM & attribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Collect production dependencies
        run: |
          composer install --no-dev --no-scripts --no-progress
          npm ci
      - name: Generate SBOM + license inventory
        run: |
          mkdir -p sbom
          # Composer license inventory (built-in).
          composer licenses --no-dev --format=json > sbom/licenses.composer.json
          # npm production SBOM (CycloneDX) + license inventory.
          # Pinned: `npx --yes` would otherwise fetch and run whatever version is
          # newest today, with the checkout and node_modules in reach. Bump on
          # purpose, not by accident.
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-file sbom/sbom.npm.cdx.json
          npx --yes license-checker-rseidelsohn@5.0.1 --production --json --out sbom/licenses.npm.json
      - name: Upload SBOM & attribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doconext_finder-sbom-attribution
          path: sbom/
          if-no-files-found: error
          # The inventory's value is being current, and it regenerates on every
          # run - so there's no reason to hold copies for the default 90 days.
          retention-days: 30
